<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mondes Subtils</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
    }

    /* NAVBAR */
    .navbar{
      position:fixed;
      top:0;
      width:100%;
      height:60px;
      background:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 20px;
      z-index:10;
    }

    /* BURGER */
    .burger{
      width:30px;
      height:22px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      cursor:pointer;
    }

    .burger span{
      height:3px;
      background:#00205b;
    }

    /* MENU */
    .menu{
      position:fixed;
      inset:0;
      background:#00205b;
      display:none;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:20px;
    }

    .menu.open{
      display:flex;
    }

    .menu a{
      color:white;
      font-size:24px;
      text-decoration:none;
    }

    /* HERO */
    .hero{
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f7f7f9;
      padding-top:60px;
      text-align:center;
    }
  </style>
</head>

<body>

  <div class="navbar">
    <div>Mondes Subtils</div>

    <div class="burger" id="burger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <div class="menu" id="menu">
    <a href="#">Accueil</a>
    <a href="#">À propos</a>
    <a href="#">Pratiques</a>
  </div>

  <div class="hero">
    <h1>Mondes Subtils</h1>
  </div>

  <script>
    const burger = document.getElementById("burger");
    const menu = document.getElementById("menu");

    burger.onclick = () => {
      menu.classList.toggle("open");
    };
  </script>

</body>
</html>
