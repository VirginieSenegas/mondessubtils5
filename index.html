<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mondes Subtils</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:white;
    }

    .navbar{
      height:70px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 20px;
      background:#fff;
      position:fixed;
      top:0;
      width:100%;
      z-index:9999;
    }

    .burger{
      width:30px;
      height:22px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .burger span{
      height:3px;
      background:black;
    }

    .menu{
      display:none;
    }

    .hero{
      margin-top:70px;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }
  </style>
</head>

<body>

  <div class="navbar">
    <div>Mondes Subtils</div>

    <div class="burger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <div class="hero">
    <h1>OK SITE CHARGE</h1>
  </div>

</body>
</html>
