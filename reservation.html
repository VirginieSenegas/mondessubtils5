<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Réserver — Mondes Subtils</title>

  <link rel="stylesheet" href="style.css" />

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#fff;
    }

    /* HERO */
    .reservation-hero{
      height:85vh;
      background:
      linear-gradient(rgba(0,32,91,0.35), rgba(0,32,91,0.35)),
      url("photoreservervotreseance.webp");
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:white;
      padding:20px;
    }

    .reservation-hero h1{
      font-size:54px;
      font-weight:300;
    }

    .reservation-intro{
      max-width:850px;
      margin:70px auto;
      text-align:center;
      font-size:20px;
      padding:0 20px;
    }

    /* CARDS */
    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
      gap:20px;
      max-width:1000px;
      margin:auto;
      padding:0 20px;
    }

    .card{
      height:180px;
      border-radius:18px;
      color:white;
      display:flex;
      align-items:flex-end;
      padding:15px;
      cursor:pointer;
      background-size:cover;
      background-position:center;
      box-shadow:0 8px 25px rgba(0,0,0,0.15);
      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.03);
    }

    /* FORM */
    .contact-wrapper{
      max-width:850px;
      margin:80px auto;
      padding:0 20px;
    }

    .contact-card{
      background:white;
      padding:50px;
      border-radius:30px;
      box-shadow:0 10px 40px rgba(0,0,0,0.08);
    }

    .contact-card h2{
      text-align:center;
      font-size:40px;
      color:#00205b;
      font-weight:300;
    }

    .contact-form{
      display:grid;
      gap:18px;
      margin-top:30px;
    }

    .contact-form input,
    .contact-form textarea{
      padding:16px;
      border-radius:14px;
      border:none;
      background:#f5f6f8;
      font-size:16px;
    }

    .contact-form textarea{
      min-height:160px;
    }

    .btn{
      background:#00205b;
      color:white;
      border:none;
      padding:16px;
      border-radius:14px;
      font-size:16px;
      cursor:pointer;
    }

    .btn:hover{
      background:#003a9b;
    }

  </style>
</head>

<body>

<!-- HERO -->
<section class="reservation-hero">
  <div>
    <h1>Réserver une séance</h1>
    <p>Accompagnement personnalisé</p>
  </div>
</section>

<!-- INTRO -->
<section class="reservation-intro">
  Choisissez une pratique puis envoyez votre demande.
</section>

<!-- CARDS -->
<section class="cards">

  <div class="card pratique-card" data-pratique="Arrêt du tabac" style="background-image:url('photoarrettabac.avif');">
    Arrêt du tabac
  </div>

  <div class="card pratique-card" data-pratique="Nettoyage énergétique" style="background-image:url('photonettoyagepersonne.png');">
    Nettoyage énergétique
  </div>

  <div class="card pratique-card" data-pratique="Nettoyage de lieux" style="background-image:url('photonettoyagelieu.avif');">
    Nettoyage de lieux
  </div>

  <div class="card pratique-card" data-pratique="Libération émotionnelle" style="background-image:url('photoliberationemotionnelle.avif');">
    Libération émotionnelle
  </div>

  <div class="card pratique-card" data-pratique="Douleurs et inconforts" style="background-image:url('douleursinconforts.png');">
    Douleurs & inconforts
  </div>

  <div class="card pratique-card" data-pratique="Se libérer des emprises" style="background-image:url('liberationrelationsousemprise.png');">
    Libération des emprises
  </div>

</section>

<!-- FORM -->
<section class="contact-wrapper">

  <div class="contact-card">

    <h2>Votre message</h2>

    <form id="contact-form" class="contact-form">

      <input type="text" name="nom" placeholder="Nom" required>
      <input type="text" name="prenom" placeholder="Prénom" required>
      <input type="tel" name="telephone" placeholder="Téléphone" required>

      <textarea id="message" name="message" placeholder="Votre message" required></textarea>

      <button class="btn" type="submit">Envoyer ma demande</button>

    </form>

  </div>

</section>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("TON_PUBLIC_KEY");

document.getElementById("contact-form").addEventListener("submit", function(e){
  e.preventDefault();

  emailjs.send("TON_SERVICE_ID", "TON_TEMPLATE_ID", {
    nom: this.nom.value,
    prenom: this.prenom.value,
    telephone: this.telephone.value,
    message: this.message.value
  });

  alert("Message envoyé !");
});
</script>

<!-- CARDS SCRIPT -->
<script>
document.querySelectorAll(".pratique-card").forEach(card => {

  card.addEventListener("click", () => {

    const pratique = card.dataset.pratique;
    const message = document.getElementById("message");

    if (!message) return;

    if (message.value.trim() === "") {

      message.value =
`Bonjour,

Je souhaite des informations concernant :

• ${pratique}

Mes disponibilités :

Mon mode de contact préféré :

Un complément d'information :`;

    } else if (!message.value.includes(pratique)) {
      message.value += `\n• ${pratique}`;
    }

    message.focus();

  });

});
</script>

</body>
</html>
